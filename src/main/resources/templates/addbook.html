<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Add Book</title>
</head>

<body>

    <h1>Add book</h1>

    <div>
        <form th:object="${book}" th:action="@{/save}" method="post">

            <label for="author">Author</label>
            <input type="text" id="author" th:field="*{author}" />

            <label for="title">Title</label>
            <input type="text" id="title" th:field="*{title}" />

            <label for="isbn">ISBN</label>
            <input type="text" id="isbn" th:field="*{isbn}" />

            <label for="publicationYear">Publication year</label>
            <input type="text" id="publicationYear" th:field="*{publicationYear}" />

            <label for="price">Price</label>
            <input type="text" id="price" th:field="*{price}" />

            <label for="category">Category</label>
            <select id="category" th:field="*{category}">
                <option th:each="category : ${categories}" th:value="${category.categoryid}" th:text="${category.name}">
                </option>
            </select>

            <input type="submit" value="Save" />

        </form>
    </div>

</body>

</html>
